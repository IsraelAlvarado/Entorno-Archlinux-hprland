# ~/.config/hypr/hyprlock.conf
# Tema glassmorphism — match con waybar

general {
    hide_cursor        = true
    ignore_empty_input = false
    immediate_render   = true
    text_trim          = true
    fractional_scaling = 2
    fail_timeout       = 2000
}

animations {
    enabled = true
    bezier  = easeOut, 0.05, 0.9, 0.1, 1.0
    animation = fadeIn,           1, 1.8, easeOut
    animation = fadeOut,          1, 1.8, easeOut
    animation = inputFieldColors, 1, 2.0, easeOut
    animation = inputFieldDots,   1, 2.0, easeOut
}

# ── Fondo ─────────────────────────────────────────────────
# path correcto: ~ = /home/israel  (sin repetir /home/israel/)
background {
    monitor     =
    path        = ~/Pictures/wallpapers/wallhaven-vm38w5_2560x1600.png
    blur_passes = 0
}

# ── Reloj ─────────────────────────────────────────────────
label {
    monitor     =
    text        = $TIME
    color       = rgba(255, 255, 255, 0.92)
    font_size   = 72
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 2
    shadow_size   = 4
    shadow_color  = rgba(0, 0, 0, 0.40)
    position    = 0, 200
    halign      = center
    valign      = center
}

# ── Fecha ─────────────────────────────────────────────────
label {
    monitor     =
    text        = cmd[update:60000] date '+%A, %d de %B de %Y'
    color       = rgba(255, 255, 255, 0.65)
    font_size   = 18
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 1
    shadow_size   = 3
    shadow_color  = rgba(0, 0, 0, 0.35)
    position    = 0, 130
    halign      = center
    valign      = center
}

# ── Avatar circular ───────────────────────────────────────
# path correcto: ~/Pictures/... no ~/home/israel/Pictures/...
image {
    monitor      =
    path         = ~/Pictures/wallpapers/wallhaven-0p522e_200x200.png
    size         = 90
    rounding     = -1
    border_size  = 2
    border_color = rgba(137, 180, 250, 0.60)
    shadow_passes = 2
    shadow_size   = 6
    shadow_color  = rgba(0, 0, 0, 0.40)
    position    = 0, 30
    halign      = center
    valign      = center
}

# ── Campo de contraseña ───────────────────────────────────
input-field {
    monitor   =
    size      = 320, 52

    outline_thickness = 2
    dots_size         = 0.28
    dots_spacing      = 0.18
    dots_center       = true
    dots_rounding     = -1

    outer_color    = rgba(255, 255, 255, 0.15)
    inner_color    = rgba(20, 20, 20, 0.70)
    font_color     = rgba(255, 255, 255, 0.90)
    font_family    = JetBrainsMono Nerd Font

    check_color    = rgba(249, 226, 175, 1.0)
    check_text     = 
    fail_color     = rgba(243, 139, 168, 1.0)
    fail_text      = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(250, 179, 135, 1.0)

    rounding          = 12
    fade_on_empty     = true
    fade_timeout      = 3000
    placeholder_text  = <span foreground="##ffffff99"> Contraseña</span>
    hide_input        = false

    shadow_passes = 2
    shadow_size   = 6
    shadow_color  = rgba(0, 0, 0, 0.35)

    position = 0, -50
    halign   = center
    valign   = center
}

# ── Usuario ───────────────────────────────────────────────
label {
    monitor     =
    text        =  $USER
    color       = rgba(255, 255, 255, 0.45)
    font_size   = 13
    font_family = JetBrainsMono Nerd Font
    position    = 0, -115
    halign      = center
    valign      = center
}

# ── Botones de poder (parte inferior central) ─────────────
# 󰐥 Apagar
label {
    monitor     =
    text        = 󰐥
    color       = rgba(243, 139, 168, 0.75)
    font_size   = 22
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 1
    shadow_color  = rgba(0, 0, 0, 0.50)
    onclick     = systemctl poweroff
    position    = -80, 40
    halign      = center
    valign      = bottom
}

# 󰜉 Reiniciar
label {
    monitor     =
    text        = 󰜉
    color       = rgba(249, 226, 175, 0.75)
    font_size   = 22
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 1
    shadow_color  = rgba(0, 0, 0, 0.50)
    onclick     = systemctl reboot
    position    = 0, 40
    halign      = center
    valign      = bottom
}

# 󰍃 Cerrar sesión
label {
    monitor     =
    text        = 󰍃
    color       = rgba(166, 227, 161, 0.75)
    font_size   = 22
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 1
    shadow_color  = rgba(0, 0, 0, 0.50)
    onclick     = loginctl terminate-session $XDG_SESSION_ID
    position    = 80, 40
    halign      = center
    valign      = bottom
}